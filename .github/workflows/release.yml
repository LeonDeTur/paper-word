name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paperword-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  release:
    if: github.ref == 'refs/heads/main'
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Publish a merged release version, or select release preparation
        id: state
        run: node scripts/release-state.mjs
      - name: Build release assets
        if: steps.state.outputs.publish == 'true'
        run: |
          npm run build
          npm run release:pack
      - name: Publish GitHub Release
        if: steps.state.outputs.publish == 'true'
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Prepare version and changelog
        id: plan
        if: steps.state.outputs.prepare == 'true'
        run: npm run release
      - name: Prepare Release PR description
        if: steps.plan.outputs.changed == 'true'
        run: node scripts/release-pr-body.mjs
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        id: pr
        if: steps.plan.outputs.changed == 'true'
        with:
          token: ${{ github.token }}
          base: main
          branch: chore/release
          delete-branch: true
          commit-message: "chore(release): v${{ steps.plan.outputs.version }}"
          title: "chore(release): v${{ steps.plan.outputs.version }}"
          body-path: .cache/release-pr.md
          add-paths: |
            package.json
            package-lock.json
            CHANGELOG.md
      - name: Run CI on the bot branch without a personal token
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run ci.yml --ref chore/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
