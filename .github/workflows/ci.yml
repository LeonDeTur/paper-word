name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}-${{ github.workflow }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Conventional Commits and branch name
        run: node scripts/ci-metadata.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: npm run check:versions
      - run: npm run check:privacy
      - run: npm run format:check
      - run: npm run lint
      - name: Validate workflow syntax
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .cache/actionlint
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o .cache/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  .cache/actionlint.tar.gz' | sha256sum --check
          tar -xzf .cache/actionlint.tar.gz -C .cache/actionlint
          .cache/actionlint/actionlint -color
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:tooling

  integration:
    name: Integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - name: Coverage
        if: runner.os == 'Linux'
        run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Linux'
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            artifacts/qa/
          retention-days: 14
          if-no-files-found: ignore

  container:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: paperword:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check production startup and unauthenticated access
        shell: bash
        run: |
          docker run -d --name paperword-ci -p 127.0.0.1:3015:3001 \
            -e APP_PASSWORD=ci-only-fixture-password \
            -e APP_ORIGIN=https://paperword.example.com paperword:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3015/api/config > /tmp/paperword-config.json; then break; fi
            sleep 1
          done
          jq -e '.authenticated == false and .password_required == true' /tmp/paperword-config.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3015/api/articles)" = 401
          test "$(docker exec paperword-ci id -u)" != 0
      - name: Container diagnostics and cleanup
        if: always()
        shell: bash
        run: |
          docker logs paperword-ci || true
          docker rm -f paperword-ci || true

  passed:
    name: CI passed
    if: always()
    needs: [quality, integration, browser, container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e "const results=JSON.parse(process.env.RESULTS); if(Object.values(results).some(r=>r.result!=='success')) process.exit(1);"
